server {
    listen 80;
    server_name @DOMAIN@;

    location / {
        add_header "Access-Control-Allow-Origin" "*" always;
        add_header "Access-Control-Allow-Methods" "POST, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, X-Signature, X-Timestamp, X-Client-Id" always;
        add_header "Access-Control-Expose-Headers" "Content-Type" always;

        if ($request_method = "OPTIONS") {
            add_header "Access-Control-Allow-Origin" "*";
            add_header "Access-Control-Allow-Methods" "POST, OPTIONS";
            add_header "Access-Control-Allow-Headers" "Content-Type, X-Signature, X-Timestamp, X-Client-Id";
            add_header "Access-Control-Max-Age" 1728000;
            add_header "Content-Type" "text/plain; charset=utf-8";
            add_header "Content-Length" 0;
            return 204;
        }

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_request_buffering off;
        proxy_http_version 1.1;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        proxy_set_header Content-Type $content_type;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 10M;

        include proxy_params;
        proxy_pass http://127.0.0.1:@PORT@;
    }
}
